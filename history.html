<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CASCADE Order History</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    :root {
      --green: #047857;
      --green-dark: #065f46;
      --green-soft: #ecfdf5;
      --table-header-gradient: linear-gradient(180deg, #d8f3e6 0%, #a9dfc6 100%);
      --row-alt-gradient: linear-gradient(90deg, #ffffff 0%, #f7fbff 100%);
      --row-active-gradient: linear-gradient(90deg, #f7fffb 0%, #e4faef 100%);
      --charcoal: #111827;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --danger: #dc2626;
      --danger-soft: #fef2f2;
      --warning: #d97706;
      --warning-soft: #fffbeb;
      --surface: #ffffff;
      --page-bg: #f6f8f7;
    }

    body {
      color: var(--text);
      background: var(--page-bg);
      background-attachment: fixed;
      background-size: cover;
  background-position: center bottom;
    }

    .history-workspace {
      max-width: 1800px;
      padding: 12px 12px 44px;
    }

    .site-footer {
      margin-top: 22px;
      border-top: 1px solid rgba(217, 224, 232, 0.9);
      padding: 22px 0 2px;
      color: #7a879a;
      font-size: 13px;
      text-align: center;
    }

    .history-heading {
      display: grid;
      grid-template-columns: 250px minmax(760px, 1fr) 195px 118px;
      gap: 12px;
      align-items: center;
      margin-bottom: 12px;
    }

    .heading-copy {
      grid-column: 1 / 4;
      display: flex;
      align-items: baseline;
      gap: 14px;
      flex-wrap: wrap;
    }

    .history-heading h1 {
      margin: 0;
      color: #0f172a;
      font-size: 30px;
      line-height: 1.1;
    }

    .history-heading p {
      margin: 0;
      color: var(--muted);
      font-weight: 600;
    }

    .history-icon {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .history-export {
      min-height: 38px;
      min-width: 118px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 18px;
      color: var(--charcoal);
      background: var(--surface);
      box-shadow: 0 8px 22px rgba(17, 24, 39, 0.06);
      font-weight: 700;
    }

    .history-filter-bar {
      display: grid;
      grid-template-columns: 250px minmax(760px, 1fr) 118px;
      gap: 12px;
      align-items: center;
      margin-bottom: 18px;
    }

    .history-filter-bar.custom-date-active {
      grid-template-columns: 250px minmax(280px, 340px) minmax(220px, 1fr) 118px;
    }

    .custom-date-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(130px, 1fr));
      gap: 12px;
    }

    .custom-date-row label {
      position: relative;
      min-height: 38px;
      display: flex;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: 0 7px 18px rgba(17, 24, 39, 0.04);
      cursor: pointer;
    }

    .custom-date-row input {
      width: 100%;
      min-height: 36px;
      border: 0;
      outline: 0;
      padding: 0 36px 0 14px;
      color: transparent;
      background: transparent;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .custom-date-row label.has-date input {
      color: #061a33;
    }

    .custom-date-row input::-webkit-datetime-edit,
    .custom-date-row input::-webkit-datetime-edit-fields-wrapper,
    .custom-date-row input::-webkit-datetime-edit-text,
    .custom-date-row input::-webkit-datetime-edit-day-field,
    .custom-date-row input::-webkit-datetime-edit-month-field,
    .custom-date-row input::-webkit-datetime-edit-year-field {
      color: transparent;
    }

    .custom-date-row label.has-date input::-webkit-datetime-edit,
    .custom-date-row label.has-date input::-webkit-datetime-edit-fields-wrapper,
    .custom-date-row label.has-date input::-webkit-datetime-edit-text,
    .custom-date-row label.has-date input::-webkit-datetime-edit-day-field,
    .custom-date-row label.has-date input::-webkit-datetime-edit-month-field,
    .custom-date-row label.has-date input::-webkit-datetime-edit-year-field {
      color: #061a33;
    }

    .custom-date-row input::-webkit-calendar-picker-indicator {
      opacity: 0;
    }

    .date-placeholder {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
      pointer-events: none;
    }

    .custom-date-row label.has-date .date-placeholder {
      display: none;
    }

    .custom-date-row .history-icon {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
    }

    .history-control {
      min-height: 38px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: 0 7px 18px rgba(17, 24, 39, 0.04);
    }

    .history-control select,
    .history-control input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      color: var(--text);
      background: transparent;
      font-weight: 700;
    }

    .date-control {
      min-width: 250px;
      padding: 0 14px;
    }

    .search-control {
      width: 100%;
      padding: 0 18px 0 28px;
    }

    .search-control input {
      font-size: 16px;
      font-weight: 600;
    }

    .filter-menu-wrap {
      position: relative;
    }

    .history-list-toolbar {
      min-height: 30px;
      width: auto;
      border: 0;
      border-radius: 0;
      padding: 0;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #061a33;
      background: transparent;
      box-shadow: none;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }

    .history-list-toolbar select {
      min-width: 66px;
      min-height: 28px;
      border: 2px solid #111827;
      border-radius: 6px;
      padding: 0 8px;
      color: #061a33;
      background: #fff;
      font-weight: 600;
    }

    .filters-button {
      min-height: 38px;
      width: 118px;
      justify-content: center;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 16px;
      color: var(--text);
      background: var(--surface);
      box-shadow: 0 7px 18px rgba(17, 24, 39, 0.04);
      font-weight: 700;
    }

    .filter-panel {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      z-index: 20;
      width: 250px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 0;
      background: var(--surface);
      box-shadow: 0 18px 44px rgba(17, 24, 39, 0.16);
    }

    .filter-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 6px 14px 8px;
    }

    .filter-heading h2 {
      margin: 0;
      font-size: 14px;
    }

    .filter-heading button {
      border: 0;
      padding: 0;
      color: var(--green-dark);
      background: transparent;
      font-size: 13 px;
      font-weight: 800;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .filter-panel label {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 38px;
      margin: 0;
      padding: 7px 12px;
      color: #061a33;
      font-size: 16px;
      font-weight: 500;
      line-height: 1.25;
      cursor: pointer;
    }

    .filter-panel label:has(input:checked) {
      background: var(--green-soft);
    }

    .filter-panel input[type="checkbox"] {
      width: 20px;
      height: 20px;
      min-width: 20px;
      margin: 0;
      accent-color: var(--green-dark);
    }

    .history-layout.list-only {
      display: block;
    }

    .history-layout.split-view {
      display: grid;
      grid-template-columns: minmax(330px, 0.32fr) minmax(760px, 0.68fr);
      gap: 20px;
      align-items: start;
    }

    .order-list-panel {
      width: 100%;
    }

    #orderList {
      overflow-x: auto;
    }

    .history-layout.list-only .order-detail-panel {
      display: none;
    }

    .order-table-card {
      overflow: hidden;
      border: 1px solid #d5dde7;
      border-radius: 8px;
      background: var(--surface);
      box-shadow: 0 10px 28px rgba(17, 24, 39, 0.06);
    }

    .order-list-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 520px;
    }

    .order-list-table th {
      padding: 9px 12px;
      color: #000;
      background: var(--table-header-gradient);
      font-size: 12px;
      font-weight: 900;
      text-align: left;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .order-list-table td {
      padding: 5px 12px;
      border-top: 1px solid #dbe3ec;
      color: #061a33;
      font-size: 16px;
      vertical-align: middle;
    }

    .order-list-table .order-id-cell {
      font-weight: 900;
    }

    .order-row {
      height: 40px;
      background: #fff;
      cursor: pointer;
      transition: background 150ms ease, box-shadow 150ms ease;
    }

    .order-row:nth-child(odd) {
      background: var(--row-alt-gradient);
    }

    .order-row:hover,
    .order-row:focus-visible {
      background: var(--row-active-gradient);
      outline: 0;
    }

    .order-row.selected {
      background: var(--row-active-gradient);
      box-shadow: inset 4px 0 0 var(--green);
    }

    .order-row.selected td:first-child {
      color: var(--green-dark);
    }

    .detail-title-row,
    .section-label-row,
    .pagination-row,
    .empty-history {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .metric {
      min-width: 0;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      padding-right: 14px;
      border-right: 1px solid var(--border);
    }

    .metric:last-of-type {
      border-right: 0;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .metric strong {
      display: block;
      color: #111827;
      font-size: 15px;
      font-weight: 400;
    }

    .summary-strip.has-reorder-tag {
      grid-template-columns: max-content repeat(3, minmax(110px, 1fr)) auto;
    }

    .summary-strip.has-reorder-tag .metric:first-child strong {
      white-space: nowrap;
    }

    .metric .reorder-tag {
      position: relative;
      display: inline-block;
      margin-left: 5px;
      border: 1px solid #bfbfbf;
      border-radius: 999px;
      padding: 0 6px;
      color: #6b7280;
      background: #d9d9d9;
      font-size: 10px;
      font-weight: 700;
      line-height: 15px;
      vertical-align: 1px;
      cursor: help;
    }

    .metric .reorder-tag:focus-visible {
      outline: 2px solid var(--green-dark);
      outline-offset: 2px;
    }

    .metric .reorder-tag-tip {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      z-index: 25;
      display: none;
      border-radius: 6px;
      padding: 7px 10px;
      color: #fff;
      background: #111827;
      box-shadow: 0 12px 28px rgba(17, 24, 39, 0.18);
      font-size: 12px;
      font-weight: 600;
      line-height: 1.4;
      white-space: nowrap;
    }

    .metric .reorder-tag:hover .reorder-tag-tip,
    .metric .reorder-tag:focus-visible .reorder-tag-tip {
      display: block;
    }

    .status-badge {
      min-height: 28px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 0 10px;
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }

    .status-completed {
      border-color: rgba(4, 120, 87, 0.16);
      color: var(--green-dark);
      background: var(--green-soft);
    }

    .status-partial {
      border-color: rgba(217, 119, 6, 0.2);
      color: #92400e;
      background: var(--warning-soft);
    }

    .status-danger {
      border-color: rgba(220, 38, 38, 0.18);
      color: var(--danger);
      background: var(--danger-soft);
    }

    .order-detail-panel {
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: visible;
      background: var(--surface);
      box-shadow: 0 14px 34px rgba(17, 24, 39, 0.08);
    }

    .detail-header {
      display: flex;
      justify-content: flex-end;
      padding: 12px 24px;
      border-bottom: 1px solid var(--border);
    }

    .detail-title-row h2 {
      margin: 0;
      font-size: 22px;
    }

    .detail-header-actions {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-left: auto;
    }

    .detail-filter-wrap {
      position: relative;
    }

    .detail-filter-button {
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 12px;
      color: #111827;
      background: var(--surface);
      font-size: 13px;
      font-weight: 700;
    }

    .detail-filter-button small {
      min-width: 22px;
      min-height: 22px;
      display: inline-grid;
      place-items: center;
      border-radius: 999px;
      color: var(--green-dark);
      background: var(--green-soft);
      font-size: 12px;
    }

    .detail-filter-panel {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      z-index: 25;
      width: 290px;
      max-height: 420px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 0;
      background: var(--surface);
      box-shadow: 0 18px 44px rgba(17, 24, 39, 0.16);
    }

    .detail-filter-group+.detail-filter-group {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }

    .detail-filter-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 6px 14px 8px;
    }

    .detail-filter-heading h3 {
      margin: 0;
      color: #111827;
      font-size: 13px;
    }

    .detail-filter-heading button {
      border: 0;
      padding: 0;
      color: var(--green-dark);
      background: transparent;
      font-size: 12px;
      font-weight: 900;
    }

    .detail-filter-heading button:hover,
    .detail-filter-heading button:focus-visible {
      text-decoration: underline;
      outline: 0;
    }

    .detail-filter-group label {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 34px;
      margin: 0;
      padding: 7px 14px;
      color: #061a33;
      font-size: 14px;
      font-weight: 650;
      cursor: pointer;
    }

    .detail-filter-group label:has(input:checked) {
      background: var(--green-soft);
    }

    .detail-filter-group input {
      width: 18px;
      height: 18px;
      margin: 0;
      accent-color: var(--green-dark);
    }

    .summary-strip {
      display: grid;
      grid-template-columns: repeat(4, minmax(110px, 1fr)) auto;
      align-items: center;
      gap: 0;
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
    }

    .summary-strip .metric {
      padding: 0 18px;
    }

    .summary-strip .metric:first-child {
      padding-left: 0;
    }

    .details-section {
      padding: 18px 24px;
    }

    .section-label-row {
      justify-content: flex-start;
      margin-bottom: 12px;
    }

    .section-label-row h3 {
      margin: 0;
      color: #111827;
      font-size: 17px;
    }

    .count-chip {
      border-radius: 999px;
      padding: 5px 10px;
      color: var(--green-dark);
      background: var(--green-soft);
      font-size: 12px;
      font-weight: 700;
    }

    .active-filter-chips {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .active-filter-chip {
      min-height: 26px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: 1px solid rgba(4, 120, 87, 0.16);
      border-radius: 999px;
      padding: 0 8px 0 10px;
      color: var(--green-dark);
      background: var(--green-soft);
      font-size: 12px;
      font-weight: 700;
    }

    .active-filter-chip button {
      width: 16px;
      height: 16px;
      display: inline-grid;
      place-items: center;
      border: 0;
      border-radius: 999px;
      padding: 0;
      color: var(--green-dark);
      background: rgba(4, 120, 87, 0.1);
      font-size: 13px;
      font-weight: 900;
      line-height: 1;
    }

    .active-filter-chip button:hover,
    .active-filter-chip button:focus-visible {
      color: #fff;
      background: var(--green-dark);
      outline: 0;
    }

    .history-table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .history-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 720px;
    }

    .history-table th {
      padding: 9px 12px;
      color: #000;
      background: var(--table-header-gradient);
      font-size: 12px;
      text-align: left;
    }

    .history-table td {
      padding: 5px 12px;
      border-top: 1px solid var(--border);
      vertical-align: top;
      font-size: 13px;
      font-weight: 400;
    }

    .history-table tbody tr:nth-child(odd):not(.product-outcomes-row) {
      background: var(--row-alt-gradient);
    }

    .history-table td strong {
      font-weight: 500;
    }

    .history-table th:nth-child(3),
    .history-table th:nth-child(4),
    .history-table td:nth-child(3),
    .history-table td:nth-child(4) {
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .history-table small {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
    }

    .empty-detail-results {
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 24px;
      background: #f8fafc;
    }

    .empty-detail-results h3 {
      margin: 0 0 6px;
      color: #111827;
      font-size: 16px;
    }

    .empty-detail-results p {
      margin: 0;
      color: var(--muted);
      font-weight: 650;
    }

    .product-toggle-cell {
      width: 46px;
      text-align: right;
    }

    .product-toggle {
      width: 30px;
      height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 6px;
      color: #111827;
      background: transparent;
      cursor: pointer;
    }

    .product-toggle-symbol {
      font-size: 18px;
      font-weight: 900;
      line-height: 1;
    }

    .product-row {
      height: 40px;
      background: #fff;
      cursor: pointer;
    }

    .product-row:nth-child(odd) {
      background: var(--row-alt-gradient);
    }

    .product-row:hover,
    .product-row:focus-visible {
      background: var(--row-active-gradient);
      outline: 0;
    }

    .product-toggle:hover,
    .product-toggle:focus-visible {
      color: var(--green-dark);
      background: var(--green-soft);
      outline: 0;
    }

    .product-row-expanded td {
      border-bottom: 0;
    }

    .product-outcomes-row>td {
      padding: 0 14px 16px;
      background: #ffffff;
    }

    .product-outcomes {
      padding-top: 8px;
    }

    .supplier-outcomes-title {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin: 0 0 10px;
    }

    .supplier-outcomes-title h3 {
      margin: 0;
      color: #111827;
      font-size: 17px;
    }

    .supplier-outcomes-title span {
      color: #1f2937;
      font-size: 15px;
    }

    .product-outcomes-table {
      border-radius: 6px;
    }

    .supplier-table th {
      background: linear-gradient(180deg, #fde8e8 0%, #f8caca 100%);
    }

    .supplier-table td:first-child {
      font-weight: 400;
    }

    .detail-summary-card {
      margin: 0 24px 22px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 18px;
      background: var(--surface);
    }

    .detail-summary-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(130px, 1fr));
      gap: 16px;
    }

    .pagination-row {
      margin-top: 10px;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      background: var(--surface);
    }

    .pagination-row-top {
      margin-top: 0;
      margin-bottom: 10px;
    }

    .pagination-range {
      justify-self: center;
      color: #061a33;
      font-size: 13px;
      font-weight: 600;
    }

    .page-buttons {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .page-button {
      min-width: 32px;
      min-height: 30px;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--charcoal);
      background: var(--surface);
      font-size: 13px;
      font-weight: 800;
    }

    .page-button.active {
      border-color: var(--green);
      color: #fff;
      background: var(--green);
    }

    .empty-history,
    .error-history {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 34px;
      background: var(--surface);
      box-shadow: 0 8px 22px rgba(17, 24, 39, 0.05);
    }

    .empty-history h2,
    .error-history h2 {
      margin-bottom: 8px;
    }

    .secondary-action.history-reset {
      min-height: 38px;
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 0 14px;
      color: var(--green-dark);
      background: var(--surface);
      font-weight: 900;
    }

    .toast-region {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 50;
      display: grid;
      gap: 10px;
      justify-items: end;
      pointer-events: none;
    }

    .toast {
      width: max-content;
      max-width: min(360px, calc(100vw - 36px));
      min-height: 0;
      height: auto;
      display: inline-flex;
      align-items: center;
      border: 1px solid rgba(4, 120, 87, 0.24);
      border-radius: 8px;
      padding: 12px 14px;
      color: var(--green-dark);
      background: var(--green-soft);
      box-shadow: 0 18px 44px rgba(17, 24, 39, 0.16);
      font-weight: 800;
      line-height: 1.35;
      pointer-events: auto;
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .skeleton-card {
      height: 132px;
      border-radius: 14px;
      background: linear-gradient(90deg, #f3f4f6, #ffffff, #f3f4f6);
      background-size: 220% 100%;
      animation: shimmer 1.4s infinite;
    }

    @keyframes shimmer {
      to {
        background-position: -220% 0;
      }
    }

    @media (max-width: 1180px) {
      .history-heading {
        grid-template-columns: 200px minmax(320px, 1fr) 195px 118px;
      }

      .heading-copy {
        grid-column: 1 / 4;
      }

      .history-filter-bar {
        grid-template-columns: 200px minmax(320px, 1fr) 118px;
      }

      .history-filter-bar.custom-date-active {
        grid-template-columns: 200px minmax(260px, 320px) minmax(260px, 1fr) 118px;
      }

      .history-layout.split-view {
        grid-template-columns: 1fr;
      }

      .order-detail-panel {
        position: fixed;
        inset: 84px 18px 18px;
        z-index: 30;
        overflow-y: auto;
      }

      .detail-filter-panel {
        right: 0;
      }
    }

    @media (max-width: 760px) {
      .history-workspace {
        padding: 20px 14px 34px;
      }

      .history-heading,
      .history-filter-bar,
      .custom-date-row,
      .summary-strip,
      .summary-strip.has-reorder-tag,
      .detail-summary-grid {
        grid-template-columns: 1fr;
      }

      .history-heading {
        display: grid;
      }

      .history-export {
        justify-content: center;
      }

      .search-control,
      .history-list-toolbar,
      .filters-button {
        width: 100%;
      }

      .metric,
      .summary-strip .metric {
        border-right: 0;
        border-bottom: 1px solid var(--border);
        padding: 0 0 12px;
      }

      .summary-strip .detail-header-actions {
        justify-content: flex-start;
        margin-left: 0;
      }

      .order-list-table th {
        padding: 9px 12px;
      }

      .order-list-table td {
        padding: 5px 12px;
      }

      .order-detail-panel {
        inset: 0;
        border-radius: 0;
      }

      .detail-header,
      .summary-strip,
      .details-section {
        padding-left: 16px;
        padding-right: 16px;
      }

      .pagination-row {
        align-items: stretch;
        grid-template-columns: 1fr;
      }

      .pagination-range {
        justify-self: center;
      }

      .detail-title-row {
        flex-wrap: wrap;
      }

      .detail-header-actions {
        width: 100%;
        justify-content: space-between;
      }

      .detail-filter-panel {
        right: auto;
        left: 0;
        width: min(290px, calc(100vw - 32px));
      }
    }
  </style>

  <script src="account-menu.js"></script>
  <script src="orderhistory-data.js"></script>
  <script src="out-of-stock-orders.js"></script>
  <script>
    // Includes the orders placed from the Out of Stock page, newest first, and sets Order Placed By.
    const historyOrders = window.CascadeOrders.allOrders(Array.isArray(window.orderHistoryData) ? window.orderHistoryData : []);
    // Today, so an order placed from the Out of Stock page shows straight away in the default 7 Days range.
    const historyToday = window.CascadeOrders.todayKey();
    const detailStatusOptions = ["Completed", "Not Fulfilled"];

    const historyState = {
      selectedOrderId: null,
      expandedProductKey: null,
      currentPage: 1,
      pageSize: 20,
      loading: true,
      lastFocusedCard: null,
      detailFiltersOpen: false,
      detailStatusFilters: new Set(detailStatusOptions),
      detailSupplierFilters: null
    };

    const els = {
      layout: document.querySelector("#historyLayout"),
      orderList: document.querySelector("#orderList"),
      detailPanel: document.querySelector("#orderDetailPanel"),
      pagination: document.querySelector("#paginationRow"),
      paginationTop: document.querySelector("#paginationRowTop"),
      dateRange: document.querySelector("#dateRange"),
      customDateRow: document.querySelector("#customDateRow"),
      customStartDate: document.querySelector("#customStartDate"),
      customEndDate: document.querySelector("#customEndDate"),
      search: document.querySelector("#historySearch"),
      filtersToggle: document.querySelector("#filtersToggle"),
      filterPanel: document.querySelector("#filterPanel"),
      statusFilters: Array.from(document.querySelectorAll("input[name='statusFilter']")),
      resetStatusFilters: document.querySelector("#resetStatusFilters"),
      pageSize: null,
      exportOrders: document.querySelector("#exportOrders"),
      toastRegion: document.querySelector("#toastRegion")
    };

    function initOrderHistory() {
      renderLoadingState();
      window.setTimeout(() => {
        historyState.loading = false;
        bindOrderHistoryEvents();
        selectFirstVisibleOrder();
        renderOrderHistory();
      }, 280);
    }

    function bindOrderHistoryEvents() {
      els.search.addEventListener("input", applyOrderHistoryFilters);
      els.dateRange.addEventListener("change", () => {
        updateCustomDateVisibility();
        applyOrderHistoryFilters();
      });
      [els.customStartDate, els.customEndDate].forEach((input) => {
        input.addEventListener("change", () => {
          updateCustomDateInputState(input);
          applyOrderHistoryFilters();
        });
        input.addEventListener("input", () => updateCustomDateInputState(input));
        updateCustomDateInputState(input);
      });
      els.customDateRow.querySelectorAll("label").forEach((label) => {
        label.addEventListener("click", () => {
          const input = label.querySelector("input");
          if (!input) return;
          input.focus();
          if (typeof input.showPicker === "function") {
            try {
              input.showPicker();
            } catch (error) {
              input.focus();
            }
          }
        });
      });
      els.statusFilters.forEach((checkbox) => checkbox.addEventListener("change", applyOrderHistoryFilters));
      els.resetStatusFilters.addEventListener("click", resetStatusFilters);
      els.filtersToggle.addEventListener("click", () => {
        const isOpen = !els.filterPanel.hidden;
        els.filterPanel.hidden = isOpen;
        els.filtersToggle.setAttribute("aria-expanded", String(!isOpen));
      });
      els.exportOrders.addEventListener("click", exportVisibleOrders);
      document.addEventListener("click", (event) => {
        if (!event.target.closest(".filter-menu-wrap")) {
          els.filterPanel.hidden = true;
          els.filtersToggle.setAttribute("aria-expanded", "false");
        }

        if (historyState.detailFiltersOpen && !event.target.closest(".detail-filter-wrap")) {
          historyState.detailFiltersOpen = false;
          const selected = historyOrders.find((order) => order.id === historyState.selectedOrderId);
          if (selected) renderOrderDetails(selected);
        }
      });
      updateCustomDateVisibility();
    }

    function renderLoadingState() {
      els.layout.className = "history-layout list-only";
      els.orderList.innerHTML = Array.from({ length: 4 }, () => '<div class="skeleton-card" aria-hidden="true"></div>').join("");
      els.pagination.innerHTML = "";
      els.detailPanel.innerHTML = "";
    }

    function renderOrderHistory() {
      const visibleOrders = filteredOrders();
      const pageCount = Math.max(1, Math.ceil(visibleOrders.length / historyState.pageSize));
      historyState.currentPage = Math.min(historyState.currentPage, pageCount);
      const start = (historyState.currentPage - 1) * historyState.pageSize;
      const pageOrders = visibleOrders.slice(start, start + historyState.pageSize);

      renderOrderList(pageOrders, visibleOrders.length, start);
      renderPagination(visibleOrders.length, pageCount);

      if (historyState.selectedOrderId) {
        const selected = historyOrders.find((order) => order.id === historyState.selectedOrderId);
        if (selected) {
          renderOrderDetails(selected);
          els.layout.className = "history-layout split-view";
        }
      } else {
        els.layout.className = "history-layout list-only";
        els.detailPanel.innerHTML = "";
      }
    }

    function filteredOrders() {
      const term = els.search.value.trim().toLowerCase();
      const selectedStatuses = new Set(els.statusFilters.filter((checkbox) => checkbox.checked).map((checkbox) => checkbox.value));
      return historyOrders.filter((order) => {
        const summary = calculateOrderSummary(order);
        const datePasses = dateMatches(order);
        const statusPasses = selectedStatuses.has(summary.status);
        const searchText = [
          order.id,
          formatOrderDate(order.dateIso),
          summary.status,
          ...order.products.flatMap((product) => [
            product.pip,
            product.description,
            product.fulfilledBy,
            ...product.outcomes.flatMap((outcome) => [outcome.supplier, outcome.comment, outcome.status])
          ])
        ].join(" ").toLowerCase();
        return datePasses && statusPasses && (!term || searchText.includes(term));
      });
    }

    function dateMatches(order) {
      const value = els.dateRange.value;
      const orderDate = dateOnly(order.dateIso);
      const today = parseDateKey(historyToday);
      if (!orderDate) return false;
      if (value === "today") return sameDate(orderDate, today);
      if (value === "yesterday") return sameDate(orderDate, addDays(today, -1));
      if (value === "last7") return orderDate >= addDays(today, -6) && orderDate <= today;
      if (value === "thisMonth") {
        return orderDate.getFullYear() === today.getFullYear() && orderDate.getMonth() === today.getMonth();
      }
      if (value === "previousMonth") {
        const previousMonth = new Date(today.getFullYear(), today.getMonth() - 1, 1);
        return orderDate.getFullYear() === previousMonth.getFullYear() && orderDate.getMonth() === previousMonth.getMonth();
      }
      if (value === "custom") {
        const start = parseDateKey(els.customStartDate.value);
        const end = parseDateKey(els.customEndDate.value);
        if (start && orderDate < start) return false;
        if (end && orderDate > end) return false;
        return true;
      }
      return true;
    }

    function updateCustomDateVisibility() {
      const isCustom = els.dateRange.value === "custom";
      els.customDateRow.hidden = !isCustom;
      document.querySelector(".history-filter-bar").classList.toggle("custom-date-active", isCustom);
    }

    function updateCustomDateInputState(input) {
      input.closest("label")?.classList.toggle("has-date", Boolean(input.value));
    }

    function dateOnly(value) {
      if (!value) return null;
      return parseDateKey(String(value).slice(0, 10));
    }

    function parseDateKey(value) {
      if (!value) return null;
      const [year, month, day] = value.split("-").map(Number);
      if (!year || !month || !day) return null;
      return new Date(year, month - 1, day);
    }

    function addDays(date, amount) {
      const next = new Date(date);
      next.setDate(next.getDate() + amount);
      return next;
    }

    function sameDate(a, b) {
      return a && b
        && a.getFullYear() === b.getFullYear()
        && a.getMonth() === b.getMonth()
        && a.getDate() === b.getDate();
    }

    function renderOrderList(orders, totalCount, startIndex) {
      if (!orders.length) {
        els.orderList.innerHTML = `
            <div class="empty-history">
              <div>
                <h2>No orders found</h2>
                <p>Try changing the date range, search term, or filters.</p>
              </div>
              <button class="secondary-action history-reset" type="button" onclick="resetOrderHistoryFilters()">Reset Filters</button>
            </div>
          `;
        return;
      }

      els.orderList.innerHTML = `
          <div class="order-table-card">
            <table class="order-list-table" aria-label="Order history results">
              <thead>
                <tr>
                  <th scope="col">Order ID</th>
                  <th scope="col">Date</th>
                  <th scope="col">Status</th>
                </tr>
              </thead>
              <tbody>
                ${orders.map((order) => renderOrderRow(order)).join("")}
              </tbody>
            </table>
          </div>
        `;
      els.orderList.querySelectorAll("[data-order-id]").forEach((row) => {
        row.addEventListener("click", () => selectOrder(row.dataset.orderId, row));
      });
    }

    function renderOrderRow(order) {
      const summary = calculateOrderSummary(order);
      const selectedClass = historyState.selectedOrderId === order.id ? " selected" : "";
      return `
          <tr class="order-row${selectedClass}" data-order-id="${order.id}" tabindex="0" role="button" aria-label="Open details for order ${order.id}">
            <td class="order-id-cell">${order.id}</td>
            <td>${formatOrderDate(order.dateIso)}</td>
            <td>${renderStatusBadge(summary.status)}</td>
          </tr>
        `;
    }

    function selectOrder(orderId, cardEl) {
      historyState.selectedOrderId = orderId;
      historyState.expandedProductKey = null;
      historyState.lastFocusedCard = cardEl;
      renderOrderHistory();
    }

    function renderOrderDetails(order) {
      const summary = calculateOrderSummary(order);
      const filteredProducts = detailFilteredProducts(order);
      const reordered = order.source === "oos";
      els.detailPanel.innerHTML = `
          <div class="summary-strip${reordered ? " has-reorder-tag" : ""}" aria-label="Order summary metrics">
            ${renderMetric("Total Products", `${summary.products} ${summary.products === 1 ? "item" : "items"}${reordered ? renderReorderTag(summary.products) : ""}`, cubeIcon())}
            ${renderMetric("Total Requested Qty", summary.requestedQty, arrowsIcon())}
            ${renderMetric("Total Received Qty", summary.receivedQty, checkIcon())}
            ${renderMetric("Order Placed By", escapeHtml(order.orderedBy || "Not recorded"), usersIcon())}
            <div class="detail-header-actions">
              ${renderDetailFilterControl()}
            </div>
          </div>
          <section class="details-section" aria-labelledby="productsTitle">
            <div class="section-label-row">
              <h3 id="productsTitle">Products in this order</h3>
              <span class="count-chip">${filteredProducts.length} of ${summary.products} ${summary.products === 1 ? "item" : "items"}</span>
              ${renderActiveDetailFilterChips()}
            </div>
            ${renderProductsTable(order, filteredProducts)}
          </section>
        `;
      bindDetailFilterEvents(order);
      els.detailPanel.querySelectorAll("[data-product-toggle]").forEach((button) => {
        button.addEventListener("click", (event) => {
          event.stopPropagation();
          toggleProductOutcomes(button.dataset.productToggle, order);
        });
      });
      els.detailPanel.querySelectorAll("[data-product-row-toggle]").forEach((row) => {
        row.addEventListener("click", (event) => {
          if (event.target.closest(".product-toggle")) return;
          toggleProductOutcomes(row.dataset.productRowToggle, order);
        });
        row.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            toggleProductOutcomes(row.dataset.productRowToggle, order);
          }
        });
      });
    }

    function renderActiveDetailFilterChips() {
      const suppliers = ensureDetailSupplierFilters();
      const chips = [];
      if (historyState.detailStatusFilters.size < detailStatusOptions.length) {
        detailStatusOptions
          .filter((status) => historyState.detailStatusFilters.has(status))
          .forEach((status) => chips.push({ type: "status", value: status }));
      }
      if (historyState.detailSupplierFilters.size < suppliers.length) {
        suppliers
          .filter((supplier) => historyState.detailSupplierFilters.has(supplier))
          .forEach((supplier) => chips.push({ type: "supplier", value: supplier }));
      }
      if (!chips.length) return "";
      return `
          <div class="active-filter-chips" aria-label="Active detail filters">
            ${chips.map(({ type, value }) => `
              <span class="active-filter-chip">
                ${escapeHtml(value)}
                <button type="button" data-remove-detail-filter="${type}" data-filter-value="${escapeHtml(value)}" aria-label="Reset ${escapeHtml(value)} filter">&times;</button>
              </span>
            `).join("")}
          </div>
        `;
    }

    function renderDetailFilterControl() {
      const suppliers = ensureDetailSupplierFilters();
      const activeCount = historyState.detailStatusFilters.size + historyState.detailSupplierFilters.size;
      return `
          <div class="detail-filter-wrap">
            <button class="detail-filter-button" id="detailFiltersToggle" type="button" aria-controls="detailFilterPanel" aria-expanded="${historyState.detailFiltersOpen}">
              ${filterIcon()}
              <span>Filter</span>
              <small>${activeCount}</small>
            </button>
            <div class="detail-filter-panel" id="detailFilterPanel" ${historyState.detailFiltersOpen ? "" : "hidden"}>
              <div class="detail-filter-group">
                <div class="detail-filter-heading">
                  <h3>Status</h3>
                  <button type="button" data-reset-detail-filter="status">Reset</button>
                </div>
                ${detailStatusOptions.map((status) => `
                  <label>
                    <input type="checkbox" name="detailStatusFilter" value="${escapeHtml(status)}" ${historyState.detailStatusFilters.has(status) ? "checked" : ""} />
                    ${escapeHtml(status)}
                  </label>
                `).join("")}
              </div>
              <div class="detail-filter-group">
                <div class="detail-filter-heading">
                  <h3>Suppliers</h3>
                  <button type="button" data-reset-detail-filter="suppliers">Reset</button>
                </div>
                ${suppliers.map((supplier) => `
                  <label>
                    <input type="checkbox" name="detailSupplierFilter" value="${escapeHtml(supplier)}" ${historyState.detailSupplierFilters.has(supplier) ? "checked" : ""} />
                    ${escapeHtml(supplier)}
                  </label>
                `).join("")}
              </div>
            </div>
          </div>
        `;
    }

    function bindDetailFilterEvents(order) {
      const toggle = els.detailPanel.querySelector("#detailFiltersToggle");
      if (toggle) {
        toggle.addEventListener("click", (event) => {
          event.stopPropagation();
          historyState.detailFiltersOpen = !historyState.detailFiltersOpen;
          renderOrderDetails(order);
        });
      }

      els.detailPanel.querySelectorAll("[data-reset-detail-filter]").forEach((button) => {
        button.addEventListener("click", (event) => {
          event.stopPropagation();
          if (button.dataset.resetDetailFilter === "status") {
            historyState.detailStatusFilters = new Set(detailStatusOptions);
          } else {
            historyState.detailSupplierFilters = new Set(detailSupplierOptions());
          }
          historyState.expandedProductKey = null;
          historyState.detailFiltersOpen = true;
          renderOrderDetails(order);
        });
      });

      els.detailPanel.querySelectorAll("[data-remove-detail-filter]").forEach((button) => {
        button.addEventListener("click", (event) => {
          event.stopPropagation();
          const value = button.dataset.filterValue;
          if (button.dataset.removeDetailFilter === "status") {
            historyState.detailStatusFilters = new Set(detailStatusOptions);
          } else {
            historyState.detailSupplierFilters = new Set(detailSupplierOptions());
          }
          historyState.expandedProductKey = null;
          renderOrderDetails(order);
        });
      });

      els.detailPanel.querySelectorAll("input[name='detailStatusFilter']").forEach((checkbox) => {
        checkbox.addEventListener("change", () => {
          historyState.detailStatusFilters = new Set(
            Array.from(els.detailPanel.querySelectorAll("input[name='detailStatusFilter']:checked")).map((input) => input.value)
          );
          historyState.expandedProductKey = null;
          renderOrderDetails(order);
        });
      });

      els.detailPanel.querySelectorAll("input[name='detailSupplierFilter']").forEach((checkbox) => {
        checkbox.addEventListener("change", () => {
          historyState.detailSupplierFilters = new Set(
            Array.from(els.detailPanel.querySelectorAll("input[name='detailSupplierFilter']:checked")).map((input) => input.value)
          );
          historyState.expandedProductKey = null;
          renderOrderDetails(order);
        });
      });
    }

    function toggleProductOutcomes(productKey, order) {
      historyState.expandedProductKey = historyState.expandedProductKey === productKey ? null : productKey;
      renderOrderDetails(order);
    }

    function renderProductsTable(order, products = detailFilteredProducts(order)) {
      if (!products.length) {
        return `
            <div class="empty-detail-results">
              <h3>No products match these filters</h3>
              <p>Adjust the detail status or supplier filters to see more products.</p>
            </div>
          `;
      }

      return `
          <div class="history-table-wrap">
            <table class="history-table">
              <thead>
                <tr>
                  <th scope="col">Product</th>
                  <th scope="col">PIP Code</th>
                  <th scope="col">Req. Qty</th>
                  <th scope="col">Rec. Qty</th>
                  <th scope="col">Status</th>
                  <th scope="col">Fulfilled By</th>
                  <th scope="col" aria-label="Supplier outcomes"></th>
                </tr>
              </thead>
              <tbody>
                ${products.map((product) => {
        const status = productStatus(product);
        const productKey = productKeyFor(order, product);
        const isExpanded = historyState.expandedProductKey === productKey;
        return `
                    <tr class="product-row${isExpanded ? " product-row-expanded" : ""}" data-product-row-toggle="${escapeHtml(productKey)}" tabindex="0" role="button" aria-expanded="${isExpanded}" aria-label="${isExpanded ? "Hide" : "Show"} supplier outcomes for ${escapeHtml(product.description)}">
                      <td><strong>${escapeHtml(product.description)}</strong></td>
                      <td>${escapeHtml(product.pip)}</td>
                      <td>${product.requestedQty}</td>
                      <td>${product.receivedQty}</td>
                      <td>${renderStatusText(status)}</td>
                      <td>${escapeHtml(product.fulfilledBy || "Not Fulfilled")}</td>
                      <td class="product-toggle-cell">
                        <button class="product-toggle" type="button" data-product-toggle="${escapeHtml(productKey)}" aria-expanded="${isExpanded}" aria-label="${isExpanded ? "Hide" : "Show"} supplier outcomes for ${escapeHtml(product.description)}">
                          <span class="product-toggle-symbol" aria-hidden="true">${isExpanded ? "-" : "+"}</span>
                        </button>
                      </td>
                    </tr>
                    ${isExpanded ? renderProductSupplierOutcomes(product) : ""}
                  `;
      }).join("")}
              </tbody>
            </table>
          </div>
        `;
    }

    function renderProductSupplierOutcomes(product) {
      const outcomes = detailFilteredOutcomes(product);
      return `
          <tr class="product-outcomes-row">
            <td colspan="7">
              <div class="product-outcomes">
                <div class="supplier-outcomes-title">
                  <h3>Supplier outcomes</h3>
                  <span>per product</span>
                </div>
                <div class="history-table-wrap product-outcomes-table">
                  <table class="history-table supplier-table">
                    <thead>
                      <tr>
                        <th scope="col">Supplier</th>
                        <th scope="col">PIP Code</th>
                        <th scope="col">Req. Qty</th>
                        <th scope="col">Rec. Qty</th>
                        <th scope="col">Status</th>
                        <th scope="col">Comment</th>
                        <th scope="col">Price</th>
                      </tr>
                    </thead>
                    <tbody>
                      ${outcomes.length ? outcomes.map((outcome) => `
                        <tr>
                          <td>${escapeHtml(outcome.supplier)}</td>
                          <td>${escapeHtml(outcome.pip)}</td>
                          <td>${outcome.requestedQty}</td>
                          <td>${outcome.receivedQty}</td>
                          <td>${renderStatusText(outcome.status)}</td>
                          <td>${escapeHtml(outcome.comment)}</td>
                          <td>${formatCurrency(outcome.price)}</td>
                        </tr>
                      `).join("") : `
                        <tr>
                          <td colspan="7">No supplier outcomes match these filters.</td>
                        </tr>
                      `}
                    </tbody>
                  </table>
                </div>
              </div>
            </td>
          </tr>
        `;
    }

    function renderPagination(totalCount, pageCount) {
      if (!totalCount) {
        els.pagination.innerHTML = "";
        els.paginationTop.innerHTML = "";
        return;
      }
      const start = (historyState.currentPage - 1) * historyState.pageSize + 1;
      const end = Math.min(totalCount, historyState.currentPage * historyState.pageSize);
      const buttons = Array.from({ length: pageCount }, (_, index) => {
        const page = index + 1;
        return `<button class="page-button${page === historyState.currentPage ? " active" : ""}" type="button" data-page="${page}" aria-label="Go to page ${page}">${page}</button>`;
      }).join("");
      const paginationHtml = `
          ${pageSizeControlTemplate()}
          <span class="pagination-range">${start} to ${end} of ${totalCount}</span>
          <div class="page-buttons">
            <button class="page-button" type="button" data-page="${Math.max(1, historyState.currentPage - 1)}" ${historyState.currentPage === 1 ? "disabled" : ""} aria-label="Previous page">&lsaquo;</button>
            ${buttons}
            <button class="page-button" type="button" data-page="${Math.min(pageCount, historyState.currentPage + 1)}" ${historyState.currentPage === pageCount ? "disabled" : ""} aria-label="Next page">&rsaquo;</button>
          </div>
      `;
      els.paginationTop.innerHTML = paginationHtml;
      els.pagination.innerHTML = paginationHtml;
      bindPaginationBar(els.paginationTop);
      bindPaginationBar(els.pagination);
    }

    function bindPaginationBar(paginationBar) {
      const pageSize = paginationBar.querySelector("[data-history-page-size]");
      if (pageSize) {
        pageSize.addEventListener("change", () => {
          historyState.pageSize = Number(pageSize.value);
          historyState.currentPage = 1;
          selectFirstVisibleOrder();
          renderOrderHistory();
        });
      }
      paginationBar.querySelectorAll("[data-page]").forEach((button) => {
        button.addEventListener("click", () => {
          historyState.currentPage = Number(button.dataset.page);
          selectFirstVisibleOrder();
          renderOrderHistory();
        });
      });
    }

    function pageSizeControlTemplate() {
      const sizes = [20, 50, 75, 100];
      return `
          <label class="history-list-toolbar">
            Show
            <select data-history-page-size aria-label="Orders per page">
              ${sizes.map((size) => `<option value="${size}" ${size === historyState.pageSize ? "selected" : ""}>${size}</option>`).join("")}
            </select>
            orders
          </label>
      `;
    }

    function applyOrderHistoryFilters() {
      historyState.currentPage = 1;
      historyState.expandedProductKey = null;
      selectFirstVisibleOrder();
      renderOrderHistory();
    }

    function selectFirstVisibleOrder() {
      const visibleOrders = filteredOrders();
      const pageCount = Math.max(1, Math.ceil(visibleOrders.length / historyState.pageSize));
      historyState.currentPage = Math.min(historyState.currentPage, pageCount);
      const start = (historyState.currentPage - 1) * historyState.pageSize;
      const firstOrder = visibleOrders[start];
      historyState.selectedOrderId = firstOrder ? firstOrder.id : null;
      historyState.expandedProductKey = null;
    }

    function resetOrderHistoryFilters() {
      els.dateRange.value = "last7";
      els.customStartDate.value = "";
      els.customEndDate.value = "";
      updateCustomDateInputState(els.customStartDate);
      updateCustomDateInputState(els.customEndDate);
      updateCustomDateVisibility();
      els.search.value = "";
      els.statusFilters.forEach((checkbox) => {
        checkbox.checked = true;
      });
      applyOrderHistoryFilters();
    }

    function resetStatusFilters() {
      els.statusFilters.forEach((checkbox) => {
        checkbox.checked = true;
      });
      applyOrderHistoryFilters();
    }

    function exportVisibleOrders() {
      const rows = filteredOrders().flatMap((order) => {
        const summary = calculateOrderSummary(order);
        return order.products.map((product) => [
          order.id,
          formatOrderDate(order.dateIso),
          summary.status,
          product.pip,
          product.description,
          product.requestedQty,
          product.receivedQty,
          product.fulfilledBy || "Not Fulfilled"
        ]);
      });
      if (!rows.length) {
        showToast("There are no matching orders to export.");
        return;
      }
      const header = ["Order ID", "Date", "Status", "PIP Code", "Product Description", "Req. Qty", "Rec. Qty", "Supplier Name"];
      const csv = [header, ...rows].map((row) => row.map(csvCell).join(",")).join("\n");
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "cascade-order-history.csv";
      link.click();
      URL.revokeObjectURL(link.href);
      showToast("Order history export started.");
    }

    function calculateOrderSummary(order) {
      const requestedQty = order.products.reduce((sum, product) => sum + Number(product.requestedQty || 0), 0);
      const receivedQty = order.products.reduce((sum, product) => sum + Number(product.receivedQty || 0), 0);
      const suppliers = new Set(order.products.flatMap((product) => product.outcomes.map((outcome) => outcome.supplier)));
      const status = normalizedOrderStatus(order.status || (receivedQty > 0 ? "Completed" : "Cancelled"));
      return {
        products: order.products.length,
        suppliers: suppliers.size,
        requestedQty,
        receivedQty,
        status
      };
    }

    function productStatus(product) {
      return normalizedProductStatus(product.status || (Number(product.receivedQty || 0) > 0 ? "Completed" : "Not Fulfilled"));
    }

    function detailSupplierOptions() {
      return Array.from(new Set(historyOrders.flatMap((order) =>
        order.products.flatMap((product) => product.outcomes.map((outcome) => outcome.supplier).filter(Boolean))
      ))).sort((a, b) => a.localeCompare(b));
    }

    function ensureDetailSupplierFilters() {
      const suppliers = detailSupplierOptions();
      if (!historyState.detailSupplierFilters) {
        historyState.detailSupplierFilters = new Set(suppliers);
      }
      historyState.detailSupplierFilters = new Set(
        Array.from(historyState.detailSupplierFilters).filter((supplier) => suppliers.includes(supplier))
      );
      return suppliers;
    }

    function normalizedDetailStatus(status) {
      return normalizedProductStatus(status);
    }

    function normalizedOrderStatus(status) {
      const normalized = String(status || "").toLowerCase();
      if (normalized.includes("complete") || normalized.includes("success")) return "Completed";
      if (normalized.includes("pending")) return "Pending";
      if (normalized.includes("processing") || normalized.includes("process")) return "Processing";
      return "Cancelled";
    }

    function normalizedProductStatus(status) {
      return String(status || "").toLowerCase().includes("complete") ? "Completed" : "Not Fulfilled";
    }

    function productMatchesDetailFilters(product) {
      const selectedStatuses = historyState.detailStatusFilters;
      const selectedSuppliers = historyState.detailSupplierFilters;
      const statusPasses = selectedStatuses.has(normalizedDetailStatus(productStatus(product)));
      const supplierNames = new Set([
        product.fulfilledBy,
        ...product.outcomes.map((outcome) => outcome.supplier)
      ].filter(Boolean));
      const supplierPasses = selectedSuppliers.size > 0
        && Array.from(supplierNames).some((supplier) => selectedSuppliers.has(supplier));
      return statusPasses && supplierPasses;
    }

    function detailFilteredProducts(order) {
      ensureDetailSupplierFilters();
      return order.products.filter(productMatchesDetailFilters);
    }

    function detailFilteredOutcomes(product) {
      return product.outcomes.filter((outcome) =>
        historyState.detailSupplierFilters.has(outcome.supplier)
      );
    }

    function productKeyFor(order, product) {
      const index = order.products.indexOf(product);
      return `${product.pip}-${index}`;
    }

    function renderMetric(label, value, icon) {
      return `
          <div class="metric">
            ${icon}
            <div>
              <span>${label}</span>
              <strong>${value}</strong>
            </div>
          </div>
        `;
    }

    function renderReorderTag(productCount) {
      const tip = productCount === 1 ? "Product is re-ordered from out of stock" : "Products are re-ordered from out of stock";
      return `<span class="reorder-tag" tabindex="0" aria-describedby="reorderTagTip">Re-ordered from OOS<span class="reorder-tag-tip" id="reorderTagTip" role="tooltip">${tip}</span></span>`;
    }

    function renderStatusBadge(status) {
      const displayStatus = String(status || "Not Fulfilled");
      const normalized = displayStatus.toLowerCase();
      const className = normalized.includes("complete") || normalized.includes("success") || normalized.includes("supplying")
        ? "status-completed"
        : normalized.includes("restrict") || normalized.includes("unknown") || normalized.includes("pending") || normalized.includes("processing")
          ? "status-partial"
          : "status-danger";
      return `<span class="status-badge ${className}">${statusIcon(displayStatus)} ${escapeHtml(displayStatus)}</span>`;
    }

    function renderStatusText(status) {
      return escapeHtml(String(status || "Not Fulfilled"));
    }

    function statusIcon(status) {
      const normalized = String(status || "").toLowerCase();
      if (normalized.includes("complete") || normalized.includes("success") || normalized.includes("supplying")) return checkIcon();
      if (normalized.includes("restrict") || normalized.includes("unknown") || normalized.includes("pending") || normalized.includes("processing")) return alertIcon();
      return xIcon();
    }

    function formatOrderDate(value) {
      const date = new Date(value);
      return new Intl.DateTimeFormat("en-GB", {
        day: "2-digit",
        month: "short",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      }).format(date).replace(",", " &middot;");
    }

    function formatCurrency(value) {
      if (value === null || value === undefined || value === "") return "-";
      return new Intl.NumberFormat("en-GB", { style: "currency", currency: "GBP" }).format(value || 0);
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function csvCell(value) {
      return `"${String(value ?? "").replace(/"/g, '""')}"`;
    }

    function showToast(message) {
      const toast = document.createElement("div");
      toast.className = "toast";
      toast.textContent = message;
      els.toastRegion.appendChild(toast);
      window.setTimeout(() => {
        toast.style.opacity = "0";
        toast.style.transform = "translateY(-8px)";
        window.setTimeout(() => toast.remove(), 180);
      }, 2600);
    }

    function calendarIcon() {
      return '<svg class="history-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 2v4"></path><path d="M16 2v4"></path><path d="M3 10h18"></path><rect x="3" y="4" width="18" height="18" rx="2"></rect></svg>';
    }

    function cubeIcon() {
      return '<svg class="history-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m21 16-9 5-9-5"></path><path d="m21 8-9 5-9-5 9-5 9 5Z"></path><path d="M3 8v8"></path><path d="M21 8v8"></path><path d="M12 13v8"></path></svg>';
    }

    function usersIcon() {
      return '<svg class="history-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>';
    }

    function arrowsIcon() {
      return '<svg class="history-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 3l4 4-4 4"></path><path d="M21 7H3"></path><path d="M7 21l-4-4 4-4"></path><path d="M3 17h18"></path></svg>';
    }

    function checkIcon() {
      return '<svg class="history-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="m8 12 2.5 2.5L16 9"></path></svg>';
    }

    function eyeIcon() {
      return '<svg class="history-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
    }

    function alertIcon() {
      return '<svg class="history-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v6"></path><path d="M12 17h.01"></path></svg>';
    }

    function xIcon() {
      return '<svg class="history-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="m15 9-6 6"></path><path d="m9 9 6 6"></path></svg>';
    }

    function filterIcon() {
      return '<svg class="history-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16"></path><path d="M7 12h10"></path><path d="M10 19h4"></path></svg>';
    }

    document.addEventListener("keydown", (event) => {
      const orderRow = event.target.closest?.(".order-row");
      if (orderRow && (event.key === "Enter" || event.key === " ")) {
        event.preventDefault();
        selectOrder(orderRow.dataset.orderId, orderRow);
      }
    });

    initOrderHistory();
  </script>
</body>

</html>
